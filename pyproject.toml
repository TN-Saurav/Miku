[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "miku-discord-music-bot"
description = "A Discord YouTube music bot with optional local voice commands."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "discord.py[voice]==2.7.1",
    "wavelink==3.5.2",
    "aiohttp==3.11.18",
    "aiosqlite==0.21.0",
    "python-dotenv==1.1.0",
    "tinytag==2.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
    "pytest-asyncio==1.0.0",
]
voice = [
    "discord-ext-voice-recv==0.5.2a179",
    "vosk==0.3.45",
]

[project.scripts]
miku = "miku.bot:main"

[tool.setuptools.dynamic]
version = { attr = "miku.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["miku*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
